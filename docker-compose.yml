version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # These override the defaults in config.py to use internal Docker networking
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    env_file:
      - .env
    depends_on:
      - redis
      - qdrant
    networks:
      - analytics_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - analytics_network

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - analytics_network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker-prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - analytics_network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - analytics_network

volumes:
  qdrant_data:

networks:
  analytics_network:
